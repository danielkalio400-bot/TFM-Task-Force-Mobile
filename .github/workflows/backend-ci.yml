name: TFM Backend CI

on:
  push:
    paths:
      - "Backend/**"
      - "Shared/contracts/**"
      - "GameClient/StarterAssets/Assets/_TFM/Performance/**"
      - "GameClient/StarterAssets/Assets/_TFM/Gameplay/Training/**"
      - "GameClient/StarterAssets/Assets/_TFM/TFM-Source-Manifest.txt"
      - "Update-TFM-Unity.ps1"
      - "GameClient/StarterAssets/Assets/_TFM/Gameplay/Combat/TFMHitscanWeapon.cs"
      - "GameClient/StarterAssets/Assets/_TFM/Gameplay/Combat/TFMTargetDummy.cs"
      - "GameClient/StarterAssets/Assets/_TFM/Gameplay/Prototype/TFMPrototypeBootstrap.cs"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - "Shared/contracts/**"
      - "GameClient/StarterAssets/Assets/_TFM/Performance/**"
      - "GameClient/StarterAssets/Assets/_TFM/Gameplay/Training/**"
      - "GameClient/StarterAssets/Assets/_TFM/TFM-Source-Manifest.txt"
      - "Update-TFM-Unity.ps1"
      - "GameClient/StarterAssets/Assets/_TFM/Gameplay/Combat/TFMHitscanWeapon.cs"
      - "GameClient/StarterAssets/Assets/_TFM/Gameplay/Combat/TFMTargetDummy.cs"
      - "GameClient/StarterAssets/Assets/_TFM/Gameplay/Prototype/TFMPrototypeBootstrap.cs"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
